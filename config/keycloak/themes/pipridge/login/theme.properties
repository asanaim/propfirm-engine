# pipridge sign in (traders): Keycloak's keycloak.v2 login pages with the
# pipridge look: ink, paper and the amber pip, a glass card, and the ridge
# terrain drawn behind it (js/terrain.js, WebGL; still for reduced motion).
parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/pipridge.css
scripts=js/terrain.js
darkMode=true

# Tab icons by their own names (Keycloak 26.8: favicons.<id>=path). Before
# pull request 75 the URL img/favicon.ico served Keycloak's icon, and
# browsers keep that response for up to 30 days, so the tab kept showing it;
# a new file name is a new URL no browser has cached. img/favicon.ico stays
# for templates that ask for it by that name.
favicons.svg=img/pipridge-tab.svg
favicons.ico=img/pipridge-tab.ico
