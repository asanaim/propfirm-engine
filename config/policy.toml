  version = 4              # 4: news rule as FTMO; 3: market breaks; 2: floor kept
  flat_before_breaks = true
  news_breaches = true
  profit_target_percent = ""
  max_loss_percent = "5"
  max_loss_kind = "trailing"
  # Owner decision K7, 12 Nov 2026 (review D1): once the trailing floor
  # reaches the starting balance it stays there; a payout does not move it
  # down again. A payout may not take the account to or below the floor, so
  # leave a buffer above it to keep trading. Version 1 accounts keep the
  # restart they were sold with.
  floor_restarts_after_payout = false
  daily_loss_percent = "3"
  min_trading_days = 0
  consistency_percent = "50"
  consistency_at_pass = false
  news_restricted = true

[addons]
# Add-ons (owner decision D-13.18, 13 Nov 2026), bought with an account and
# kept through every stage. Each is priced as a share of the account's list
# price; a discount is taken off the list price only. An account with an
# add-on runs on a derived rule set: the stage's id followed by the add-on
# ids (lite-funded-v3-swing). A weekly payout add-on was rejected.
split_percent = "90"      # split90: the funded split from the first payout
swing_leverage = 30       # swing: leverage at most 1:30 (lower instrument leverage stays)
swap_free_nights = 5      # swapfree: no swap on each position's first 5 nights
off = []                  # add-ons switched off (not sold); accounts keep theirs

[addons.split90]
price_percent = "20"
products = ["lite", "one-step"]

[addons.swing]            # weekend and news holding: no news or market break rule
price_percent = "15"
products = ["lite", "one-step"]

[addons.swapfree]
price_percent = "10"
products = ["lite", "classic", "one-step", "instant"]

[trial]
# Free trial (D-13.17, 13 Nov 2026): the product's first stage rules on one
# size, for `days` days, one per customer, never funded, no payout, no
# prize. It runs on its own rule set (lite-s1-v4-trial) so it never
# progresses. Size: the smallest Lite (D-14.13).
on = true
product = "lite"
size_cents = 1000000
days = 14

[referrals]
# Referral ledger (D-14.15, 19 Nov 2026; the commission model was open,
# D41, and is taken under the owner's standing rule D-14.7). A trader's
# code, entered by a new customer at registration, earns this share of
# what that customer pays for their first paid account (none on repeat
# accounts, CONFIRMED; none on a free trial). It becomes available after
# the holdback; paying it out comes with the affiliate programme.
on = true
commission_percent = "10"
holdback_days = 30
refused_countries = ["BD", "IN"]  # C8: no referrals by or of residents

[reserve]
# Payout reserve (D-13.7, 13 Nov 2026; built under D-14.20). At each paid
# sale this share of the price moves from operating cash to the reserve,
# and payouts are drawn from it. The shares are the base model's (strategic
# review v3, D3): 1.25 times each product's expected payout share. Classic
# is off sale; it needs a share before it opens.
on = true
sweep_factor = "1.25"          # sweep = factor x expected payout share
open_weight = "0.5"            # R*: weight of profit in open positions
expected_weight = "1.5"        # R*: weight of evaluations' expected payouts
amber_below = "1.3"            # coverage K: normal at or above
red_below = "1.1"
breach_below = "1.0"
release_above = "1.3"          # cash above this times R* may return monthly
sweep_percent = { lite = "72", one-step = "66", instant = "27" }

[classes]
# Daily trader classes (D-14.28; strategic review v3, D5): starting values
# to tune on free-trial data. A: proven; B: standard; C: watch (no scaling,
# no Instant purchase, every payout reviewed in a case); D: restricted (a
# case actioned in the last d_case_days).
on = true
a_min_trading_days = 60
a_min_trades = 200
a_min_t_stat = "2.0"           # mean daily result over its standard error
a_min_profit_factor = "1.3"    # gross profit over gross loss
a_min_paid_payouts = 3
a_max_short_percent = 20       # A: under this share of profit from short holds
c_short_percent = 50           # C: over this share of profit from short holds
short_seconds = 60             # a short hold: closed by the trader within this
d_case_days = 90
c_lot_percent = 50             # class C: lot caps halved for new exposure (D-14.34)
d_lot_percent = 0              # class D: close only

[detectors]
# Behaviour detectors (D-14.29; strategic review v3, D6): starting values
# to tune on free-trial data. Each raises a high fraud alert, which opens a
# case and so holds the customer's payouts; two people decide a void.
hedging = true                 # opposite positions across accounts of one person
hedging_window_seconds = 120   # opened within this of each other
hedging_overlap_percent = 50   # open together this share of the shorter hold
hedging_matches = 3            # this many hedged pairs ...
hedging_days = 30              # ... in this many days
gap = true                     # gap trading: profitable positions only
gap_before_break_minutes = 120 # opened this soon before a long break, held through it
gap_release_minutes = 5        # or opened this near a release (either side) ...
gap_size_multiple = "2"        # ... above this times the account's median volume
gap_days = 30                  # positions opened in this many days
reentry = true                 # consistency gaming: one trade split by the day boundary
reentry_seconds = 60           # reopened (symbol, side) this soon after a close, across 17:00 NY
reentry_matches = 3            # this many re-entries ...
reentry_days = 30              # ... in this many days raise an alert
stale = true                   # stale price: client fills against the reference source
stale_spreads = 1              # a fill better than the reference by more than this many spreads
stale_quote_age_ms = 2000      # the reference quote at most this much older than the fill
stale_fills = 5                # this many stale fills ...
stale_days = 30                # ... in this many days: high alert (payouts held) and class C
rate = true                    # request rate: throttle at the API
rate_orders_per_day = 2000     # order requests per account per trading day, then 429
rate_repeats = 2               # this many throttled days ...
rate_repeat_days = 30          # ... in this many days raise an alert (a case)

[exposure]
# The exposure desk (D-14.32; strategic review v3, D4): scenario liability
# of funded accounts by exact revaluation, against the free reserve. Cut
# levels are recorded, shown to staff and applied by the engine to new
# orders within a minute (D-14.34).
on = true
every_minutes = 5
sigma_days = 60           # daily returns for each symbol's standard deviation
min_days = 20             # fewer days of history: the class stress move instead
bloc_usd_bp = 150         # every USD pair 1.5 % ...
bloc_gold_bp = 300        # ... with gold 3 % the same way as CUR/USD
bloc_crypto_bp = 1000     # all crypto 10 %
bloc_oil_bp = 600         # all oil 6 %
symbol_limit_percent = 25 # one symbol's worst case, of the free reserve
bloc_limit_percent = 50   # a bloc's worst case, of the free reserve
alert_percent = 80        # of a limit: alert the risk desk
halve_percent = 100       # lot caps halved for classes B and C, that symbol and side
quarter_percent = 150     # lot caps quartered for all classes
restore_percent = 60      # back to baseline after restore_hours under this
restore_hours = 24
halve_lot_percent = 50    # the lot caps a halving cut leaves (D-14.34)
quarter_lot_percent = 25  # and a quartering cut

[exposure.stress_bp]      # one stress move per asset class, both ways
forex = 150
metal = 300
oil = 600
crypto = 1000

[cohorts]
# The cohort alarm (D-14.33; strategic review v3, D3 and D6). A cohort whose
# pass rate is above its product's zero edge bound at this significance, on
# an exact one sided binomial test, holds its payouts until staff clear it;
# an affiliate's cohort also pauses the affiliate's commission.
on = true
every_hours = 6
significance = "0.01"
min_resolved = 10                  # results before a cohort can alarm, and again after a clear
instant_products = ["instant"]     # success: the trailing floor locked at the start

[cohorts.bounds]                   # the pass rate of a trader with zero edge
lite = "0.25"                      # pricing study: 6 % target against 6 % loss, twice
classic = "0.2735"                 # 8/18 times 8/13: exact (no time limit, so the daily limit lowers no bound)
one-step = "0.375"                 # pricing study
instant = "0.368"                  # pricing study: the floor locks before it is hit

[sharing]
# Account sharing (D-14.35; strategic review v3, D6). A trader's sign ins:
# the device (a hash), the country and the rough place from the proxy's
# GeoIP headers, never the IP address. Either rule raises an alert (a case
# holds payouts) and asks for a step up before the next payout or wallet
# change.
on = true
window_days = 7
max_devices = 3       # more devices in the window
max_countries = 3     # more countries in the window
travel_km = 500       # two sign ins further apart than this ...
travel_minutes = 60   # ... within this time

[subscribers]
# The newsletter (rule AC25, D-15.1): double opt-in, and each consent keeps
# the time, the place on the site and this exact wording (a new wording is
# a new version; earlier consents keep theirs).
on = true
wording = "Send me Pipridge news, new products and offers by email. One click unsubscribes."
max_per_hour = 200    # confirmation emails a public form may send each hour
per_minute = 60       # newsletter emails sent each minute, within the mail provider's limits
attempts = 3          # tries per address before a send is given up

[retention]
# Erasure of personal data (rule AC27, D-15.5): refused until this many
# years after the relationship ends (D35; FATF R.11 minimum: five). Raise it
# where a local law asks for longer.
aml_years = 5
