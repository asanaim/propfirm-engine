# Firm policy: the numbers and switches the firm can change without code.
#
# How to change something:
#   - Edit this file and restart the engine (docker compose restart engine).
#     The engine applies the change through its journal, so every decision
#     stays traceable to the settings in force at the time.
#   - Product rules: raise the stage's `version` whenever you change any of
#     its numbers. Versions never change once published: accounts already
#     open keep the version they started on; new accounts get the new one.
#   - Admin-only settings (starting values here; an admin changes them
#     through the API, and the admin value wins): access.country_gating,
#     access.blocked_countries, and each stage's profit_target_percent,
#     daily_loss_percent, max_loss_percent and max_loss_kind.
#   - Trading settings: change `trading.config_version` whenever you change
#     anything under [trading]. Open positions keep the margin set when
#     they opened.
#
# Formats: percentages are text ("6", "3.5") so they stay exact; money is
# whole US cents; volumes are hundredths of a lot; times are milliseconds.

[access]
# Refuse customers whose ID document, IP address or device country is in
# `blocked_countries`. Off: everyone may register (the plan's settled input
# excluded Bangladesh and India; changed on 29 Oct 2026, see counsel C8).
# Admin-only setting: these are starting values; an admin changes them
# through the API (PUT /admin/access/country-gating), and that value wins.
country_gating = false
blocked_countries = ["BD", "IN"]  # ISO 3166-1 alpha-2
min_age = 18                   # years, from the date of birth given at registration

[news]
# Default window around a restricted event: no trade opens or closes from
# `before_minutes` before to `after_minutes` after it. Which stages it binds
# is each stage's `news_restricted` (as FTMO: funded only; decided 31 Oct
# 2026). Breaking it on a funded account raises an integrity case, which
# can end the account (as FTMO: "may lead to termination").
before_minutes = 2
after_minutes = 2

[payouts]
minimum_cents = 5000           # $50
first_after_days = 14          # the 14th trading day after the first trade, as FTMO
# On request, as FTMO (first reward from day 14, then a 14-day cycle; sent
# 1-2 business days after approval) and FundedNext (paid within 24 hours);
# replaces the 15th and last day of the month (D17), 30 Oct 2026.
interval_days = 14             # a later payout no sooner than this after the last
approvals_required = 2         # people who must approve each payout
# Who approves [decided 31 Oct 2026]: a senior staff member (T2 or above,
# payouts role) passes it, then an admin (T4) authorises it; never one's own,
# never the same person twice, and no amount is approved below admin. The
# fee refund paid with a payout follows the same rule. "count": any
# `approvals_required` employees (the rule before).
approval = "pass_authorise"
# D22, D23, confirmed 30 Oct 2026. FTMO (reward on request 14 days from the
# first trading day; account in profit with no open positions or pending
# orders) and FundedNext (Stellar standard rewards) set no minimum trading
# days and no maximum for a funded-account reward.
basis = "closed_balance"       # profit measured on the closed balance at request
flat_required = true           # no open position or pending order when requesting
min_trading_days = 0           # none, as FTMO and FundedNext
maximum_cents = 0              # no maximum, as FTMO and FundedNext
# Payout processing (M19), starting values [DEFAULT]:
trading_during_payout = "paused"  # D23: no new orders from request to approval (the debit)
require_mfa = true             # M04: the login must have used MFA to change the wallet or ask
# Step-up (M06): that second factor entered no more than this many minutes
# before the wallet change or payout request, as Binance asks for a 2FA
# code when a withdrawal address is added and FundedNext an OTP for each
# payout request; the portal then signs the trader in again (OIDC max_age).
step_up_minutes = 5            # 0: any login that used MFA
# No waiting period on a new or changed payout wallet, as FTMO, FundedNext
# and The5ers (checked 30 Oct 2026: the wallet is given with the request;
# FundedNext confirms the request by OTP). A wait of N hours can be set here.
wallet_cooling_off_hours = 0
# Short holds (section 1, 13 Nov 2026; not an automatic ban): more than this
# share of the period's profit from trades the trader closed within this many
# seconds of opening holds the payout request for review (an integrity case).
# A stop loss or take profit does not count. 0 percent: off.
short_hold_seconds = 60
short_hold_share_percent = 50

[scaling]                      # Lite, Classic and 1-Step funded accounts
review_months = 4
min_net_profit_percent = "10"
min_paid_payouts = 3
step_percent = "20"            # added to initial capital per step
split_after_step = 2           # from this step the split below applies
split_percent_after = "90"
max_allocation_cents = 40000000  # $400,000 per trader

[catalogue]
# What is on sale (review D4; owner decisions K2 and K4, 12 Nov 2026).
# Owners and admins switch products and sizes on and off in the back office
# (a second admin or owner approves); these are the starting values.
# Accounts already bought keep their product and rules.
products_off = ["classic"]     # K2: Lite, 1-Step and Instant are sold; Classic is off
sizes_off = []                 # sizes in cents, e.g. [500000] for 5K
# An Instant account (straight to funded) is held once per trader at a time.
one_instant_funding_per_trader = true
# The allocation cap is scaling.max_allocation_cents ($400,000): the funded
# capital of a trader's accounts that are open, passed and waiting, paid
# and not yet opened, or ordered and unpaid for up to this many hours.
unpaid_hold_hours = 24

[trading]
config_version = "trading-v8"  # v8: market break rule; v7: holidays, no cancel when closed
delay_threshold_ms = 2000      # older updates freeze the symbol
gap_threshold_ms = 60000       # no update for longer freezes the symbol
gap_threshold_ms_by_symbol = {}  # e.g. { "XAU/USD" = 90000 }
# Review D2: a market order or a close is refused while the symbol's last
# price is older than this; the trader tries again on a newer price. 0: off.
# [DEFAULT] to calibrate per symbol from the feed trial (the 99th
# percentile gap between updates).
quote_age_ms = 3000
quote_age_ms_by_symbol = {}    # e.g. { "XRP/USD" = 10000 }

[trading.sanity]
# Review D9: an update that moves more than BOTH `multiple` times the median
# of the recent price changes (once there are `min_changes` of them) AND
# `min_basis_points` of the last price is held: it fills, triggers and
# breaches nothing until the next update shows whether the move was real.
# multiple = 0: off.
multiple = 8
min_basis_points = 50          # 0.5 %
min_changes = 5

[trading.leverage]             # "100" means 1:100
forex = "100"
metal = "50"
oil = "20"
crypto = "3.33"

[trading.lot_caps]             # per $100,000 of initial balance: [per order, per symbol]
forex = [5000, 10000]
metal = [2000, 4000]
oil = [2000, 4000]
crypto = [1000, 2000]

[trading.spread]
# The feed has no bid or ask, so the spread is set the way broker houses
# quote it: the normal spread below in a calm market; wider while the
# market keeps moving fast (the median of the last `window` price changes,
# once there are `min_samples`, times `vol_multiplier`), never above
# `max_multiple` times the normal spread; multiplied inside news windows and
# around the 17:00 New York rollover, when liquidity moves to Asia. A single
# jump or bad tick does not widen it.
window = 20                    # recent price changes considered
min_samples = 3                # changes needed before the market can widen it
vol_multiplier = "1"
max_multiple = 10              # widest spread = 10 x the normal spread
news_multiplier = 3            # inside a news window
rollover_multiplier = 3        # around the daily rollover [DEFAULT]
rollover_before_minutes = 5    # from 16:55 New York
rollover_after_minutes = 15    # to 17:15 New York

[trading.spread.min_points]
# The normal (calm-market) spread per symbol, in points, as an all-in cost:
# spread plus round-trip commission (there is no separate commission here).
# Set 29 Oct 2026 to the median of FTMO, FundedNext, Exness (Standard) and
# OANDA (spread only), rounded up to a whole point; see
# docs/spread-benchmarks.md. The engine quotes the next even number of
# points, so the feed price stays the mid. Forex: 10 points = 1 pip.
"EUR/USD" = 8                  # 0.8 pip
"GBP/USD" = 11                 # 1.1 pip
"USD/JPY" = 14                 # 1.4 pip
"USD/CHF" = 14                 # 1.4 pip
"AUD/USD" = 10                 # 1.0 pip
"USD/CAD" = 14                 # 1.4 pip
"NZD/USD" = 14                 # 1.4 pip
"EUR/GBP" = 12                 # 1.2 pip
"EUR/JPY" = 20                 # 2.0 pip
"EUR/CHF" = 17                 # 1.7 pip
"EUR/AUD" = 21                 # 2.1 pip
"EUR/CAD" = 26                 # 2.6 pip
"EUR/NZD" = 35                 # 3.5 pip
"GBP/JPY" = 30                 # 3.0 pip
"GBP/CHF" = 20                 # 2.0 pip
"GBP/AUD" = 23                 # 2.3 pip
"GBP/CAD" = 26                 # 2.6 pip
"AUD/JPY" = 18                 # 1.8 pip
"AUD/CAD" = 23                 # 2.3 pip
"CAD/JPY" = 20                 # 2.0 pip
"CHF/JPY" = 23                 # 2.3 pip
"XAU/USD" = 47                 # $0.47 an ounce
"XAG/USD" = 33                 # $0.033 an ounce
"WTI" = 6                      # $0.06 a barrel
"Brent" = 6                    # $0.06 a barrel
# Crypto: the raw spread only (median of FTMO's and FundedNext's raw
# spreads); the commission below is charged on top, as those firms do.
"BTC/USD" = 1089               # $10.89 raw
"ETH/USD" = 58                 # $0.58 raw
"SOL/USD" = 10                 # $0.10 [E]: no house publishes SOL; calibrate in P3
"XRP/USD" = 13                 # $0.0013 raw
"LTC/USD" = 68                 # $0.68 raw (FTMO $0.15, FundedNext $1.21)

[trading.commission]
# Charged once, when a position opens, as a percent of its notional at the
# fill price (in USD, rounded half-even to the cent); it counts in balance,
# equity, the loss limits and the day's P&L. "0" = none: the spread above
# carries the whole cost (forex, metals, oil match the houses' all-in cost).
# Crypto: median of FTMO 0.065 % and FundedNext 0.04 %. With the raw spread
# this keeps BTC's total cost at about $53 a coin at $80,900, as at those
# firms, while the spread a trader sees is about $11.
forex = "0"
metal = "0"
oil = "0"
crypto = "0.0525"

[trading.swaps]
# Overnight swaps (K6, D-13.19; product line version 1, section 8), charged
# at each 17:00 New York reset on open positions, never credited:
#   charge = position value x annual rate x nights / 360
# Forex: the costly side pays the rate differential plus markup_percent
# (the other side pays nothing); gold and silver long: USD rate plus
# metal_markup_percent; oil long: oil_long_percent; crypto: crypto_percent
# both sides every night. Forex, metals and oil: Wednesday's reset carries
# 3 nights, Saturday and Sunday none.
# markup, oil and crypto are starting values [A], to be checked against one
# broker's published table (build plan step 8).
markup_percent = "1"
metal_markup_percent = "1"
oil_long_percent = "4"
crypto_percent = "15"

[trading.swaps.rates_percent]
# Central bank policy rates, owner settings: change them with
# trading.config_version when a bank moves. As of 13 Nov 2026:
USD = "4"      # Fed: top of the 3.75 to 4 % target range (28 Oct 2026)
EUR = "2.5"    # ECB deposit facility (29 Oct 2026)
GBP = "4"      # Bank of England Bank Rate (5 Nov 2026)
JPY = "1.25"   # Bank of Japan (30 Oct 2026)
CHF = "0"      # SNB (24 Sep 2026)
AUD = "4.85"   # RBA cash rate (3 Nov 2026)
CAD = "2.5"    # Bank of Canada (28 Oct 2026)
NZD = "2.75"   # RBNZ official cash rate (28 Oct 2026)

[trading.hours]
# Trading hours in New York time (build plan step 1, D6). Outside them the
# engine refuses orders, closes and stop changes ("market_closed"), holds
# pending orders and stops, and ignores any price that arrives. Weekday and
# time as "Sun 17:00"; daily_break as "17:00-18:00" ("" = none).
# [DEFAULT] the major CFD brokers' sessions; check against the chosen
# price source's hours in the feed trial (step 8).

# Market break rule (funded Standard accounts, as FTMO): positions are closed
# and pending orders cancelled this many minutes before a closed period of
# long_break_minutes or more (the weekend, a holiday halt); in those minutes
# no new order opens. [DEFAULT] 5 minutes ("shortly before", FTMO).
flat_before_break_minutes = 5
long_break_minutes = 120

[trading.hours.forex]
always = false
open = "Sun 17:00"
close = "Fri 17:00"
daily_break = ""

[trading.hours.metal]          # CME Globex session: a daily hour's break
always = false
open = "Sun 18:00"
close = "Fri 17:00"
daily_break = "17:00-18:00"

[trading.hours.oil]
always = false
open = "Sun 18:00"
close = "Fri 17:00"
daily_break = "17:00-18:00"

[trading.hours.crypto]         # every minute
always = true

# Holiday closures, New York wall time [from, to); classes they close.
# Metals and oil follow the CME Globex holiday schedule (Central time + 1 h):
# on a Monday or Thursday holiday they halt at 14:30 and reopen at 18:00;
# full closures and early closes as listed. Forex closes for Christmas and
# New Year's Day only: spot currencies trade through US holidays (thin).
# Crypto never closes. CME finalises each holiday's hours about two weeks
# before it: check them then and correct an entry if CME changed it.
