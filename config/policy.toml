[contract]
# The funded-trader agreement, issued after Tier 2 verification (outline
# M18). Text in config/contracts/<template>.txt. Until firm_name (C14) and
# governing_law (counsel) are set, a contract is issued only in the sandbox,
# marked DRAFT.
template = "funded-agreement-v4"  # v3: the split ladder; v4: add-ons (D-13.18)
firm_name = ""
governing_law = ""
account_disclosure = "simulated"  # D1: "simulated" or "live"

[staff]
# The back office (staff spec, step 5a). Every approval (payouts, voids and
# profit removals, funded reviews, identity reviews, grants, settings, news
# cancels) needs a second factor entered at most `step_up_minutes` before
# (step-up, RFC 9470; as the trader's payout request).
approvals_need_mfa = true
step_up_minutes = 5            # 0: any login that used MFA
# Every staff and admin login needs a second factor (one-time code or
# passkey), not a password alone [decided 6 Nov 2026; ISO 27001 A.8.5].
login_needs_mfa = true
# Staff and their households never hold challenges or trade the firm's
# accounts [decided 6 Nov 2026]: a login with staff access gets no trader
# view. Households are declared (conflict-of-interest register, 5d).
staff_may_trade = false
# Maker-checker on settings [staff spec, outline M07, M25; rule AC00,
# decided 8 Nov 2026: every decision needs two people, one proposes and the
# other approves]: a change is a proposal until a second person, never its
# maker, approves it. It cannot be switched off here (false is refused).
# Product changes (stage limits) are owner level (rule AC01): one owner
# proposes, the other owner approves. Country gating: admins or owners.
# Not approved within the expiry: proposed again.
settings_need_second_admin = true
proposal_expiry_hours = 72
# The owners' stand-in approver [decided 8 Nov 2026]: an admin (T4) whom
# both owners appoint (one proposes, the other approves) for at most this
# many days; while appointed, they may approve a product change in place
# of an unavailable owner, never one of their own and never a stand-in
# change. Ended early by the same two-owner decision.
stand_in_max_days = 30
# A leaver loses every login [decided 6 Nov 2026]: access in the platform
# ends at once; the identity provider disables the login and its sessions
# within the minute. Not done after the alert time: leads and admins are
# alerted to do it by hand; the hard limit is 24 hours.
leaver_cutoff_alert_minutes = 60
leaver_cutoff_max_hours = 24
# The training gate [staff spec 5c]: a level of T1 or above in a section,
# and an apprentice's graduation, need that section's course
# (config/staff/courses.toml) passed within the last 12 months.
training_gate = true
training_valid_months = 12
# Pre-employment screening [decided 7 Nov 2026] (config/staff/screening.toml):
# every check at hire and every year; a lead (T3) records, an admin (T4)
# approves (not a recorder, not the person); no staff access without a current
# approval (owners exempt). Rescreening shows on the to-do list 30 days ahead.
screening_required = true
screening_valid_months = 12
screening_due_days = 30
# Oversight [staff spec 5d]. An urgent alert nobody acknowledged is raised
# to leads and admins after `escalate_hours`. No sign-in for `dormant_days`:
# access suspended until an admin reinstates (owners exempt). Leads review
# their team's access every `review_days_lead`; owners each admin's every
# `review_days_admin`. The weekly anomaly report flags approvals outside
# office hours (Dhaka, Sunday to Thursday, 09:00-18:00; Monday = 0) and the
# same maker and checker `pair_threshold` times or more.
escalate_hours = 4
dormant_days = 30
review_days_lead = 90
review_days_admin = 30
office_timezone = "Asia/Dhaka"
office_days = [6, 0, 1, 2, 3]
office_start_hour = 9
office_end_hour = 18
pair_threshold = 3
# Apprentices [decided 31 Oct 2026]: a term of 3 to 6 months, set for each.
apprentice_min_months = 3
apprentice_max_months = 6
power_max_days = 90            # an admin power granted below T4 ends within this
acting_max_days = 30           # acting cover ends within this
# Section assignments [decided 6 Nov 2026, clarified the same day]: one person
# may hold a level (up to Lead, the section's charge) or a role in several
# sections. "home_section": in the member's own section (their team) an
# employee of that section (level >= home_proposer_min_level) proposes and an
# admin approves; in another section an admin proposes and an owner approves;
# for an admin, one owner proposes and the other approves. "owner": every
# section as another section. "admin": the section's lead or an admin asks,
# an admin approves (the rule of 5 Nov). Never the proposer approves.
sections_approval = "home_section"
home_proposer_min_level = 1

[cases.sla_hours]
# Integrity, fraud and compliance cases (M16, M17, M20): hours from an alert
# to its case's due time, by the case's highest severity [DEFAULT].
low = 168
medium = 72
high = 24

