# Restricted news events for December 2026 (M13, CC-5).
#
# The list is FTMO's restricted events (read 31 Oct 2026; decided the same
# day); each date and time is the publisher's own, read 31 Oct 2026 (the
# source line). Each window runs 2 minutes before to 2 minutes after the
# release; they bind funded accounts only. Times are the publisher's local
# time; the engine stores UTC.
#
# The news collector reads most of these schedules itself; this file is the
# record for releases it cannot read (BLS: US jobs and CPI; the Reserve Bank
# of New Zealand) and a fallback for the rest. Ids match the collector's, so
# a release in both is one event. Recheck every date before the event; a
# changed date is a new version of this file.
#
# v2: FTMO's list; the Bank of Japan is not on it and is no longer listed.
# The RBNZ date is from its press release as republished by Scoop (the RBNZ
# site refused automated reads); 14:00 Wellington is its usual time.
# EIA had published no December holiday changes when checked.

version = "news-2026-12-v2"
month = "2026-12"
checked = "2026-10-31"

