[project]
name = "propfirm-engine"
version = "0.1.0"
description = "Prop firm trading engine: prices, fills, rules, ledger and replay"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "tzdata==2026.6",
    "valkey==6.2.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "hypothesis==6.170.13",
    "ruff==0.17.3",
    "mypy==2.4.1",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "propfirm"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs running services (Valkey, PostgreSQL); see README",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
