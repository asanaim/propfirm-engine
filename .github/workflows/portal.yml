name: portal

# Actions minutes are billed on this private repository (2,000 a month on
# the free plan), so each workflow runs only when its files change, once per
# pull request (not again on the merge to main). D-14.11.
on:
  pull_request:
    paths:
      - "portal/**"
      - "web/**"
      - "scripts/size-budget.mjs"
      - ".github/workflows/portal.yml"
  workflow_dispatch:

concurrency:  # a newer push to the same pull request cancels the older run
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portal:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: node ../scripts/size-budget.mjs dist 130000  # first download, gzip
