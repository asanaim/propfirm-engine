name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      valkey:
        image: valkey/valkey:9.1.3-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 2s
          --health-timeout 3s --health-retries 30
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: propfirm
          POSTGRES_PASSWORD: propfirm-ci
          POSTGRES_DB: propfirm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U propfirm -d propfirm" --health-interval 2s
          --health-timeout 3s --health-retries 30
    env:
      VALKEY_URL: redis://localhost:6379/0
      DATABASE_URL: postgresql://propfirm:propfirm-ci@localhost:5432/propfirm
      KEYCLOAK_URL: http://localhost:8080
      # CI must run the integration tests, never skip them.
      PROPFIRM_REQUIRE_SERVICES: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Start Keycloak with the development realm
        run: |
          docker run -d --name keycloak -p 8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin-ci \
            -e KC_HOSTNAME=http://localhost:8080 \
            -v "$PWD/config/keycloak:/opt/keycloak/data/import:ro" \
            quay.io/keycloak/keycloak:26.8.1 start-dev --import-realm
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
      - run: uv python install 3.14
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy
      - name: Wait for Keycloak
        run: |
          for i in $(seq 1 90); do
            curl -sf http://localhost:8080/realms/propfirm/.well-known/openid-configuration \
              > /dev/null && exit 0
            sleep 2
          done
          docker logs keycloak
          exit 1
      - run: uv run --frozen pytest

  portal:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backoffice:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backoffice
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: backoffice/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # P2 step 7a: dependencies, code, secrets and the runtime image
  security:
    runs-on: ubuntu-24.04
    env:
      GRYPE: anchore/grype:v0.121.0@sha256:621d56d1d68106b787022c81546f7e0a36202a25d1239f0c20195fab8c16f7ea
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
      - run: uv python install 3.14
      - name: Python dependencies (pip-audit, every group, hashes required)
        run: |
          uv export --frozen --all-groups --format requirements-txt --no-emit-project \
            > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/requirements.txt" --require-hashes \
            --disable-pip --progress-spinner off
      - name: Python code (bandit; skips explained in pyproject.toml)
        run: uvx bandit==1.9.4 -c pyproject.toml -r src -q
      - name: Secrets (detect-secrets against the reviewed baseline)
        run: |
          uvx detect-secrets==1.5.0 scan --baseline .secrets.baseline \
            --exclude-files '(^|/)(package-lock\.json|uv\.lock)$'
          python3 scripts/security_gate.py secrets .secrets.baseline
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.4"
      - name: npm dependencies shipped to browsers (accepted advisories only)
        run: |
          for app in portal backoffice; do
            (cd "$app" && npm audit --omit=dev --json || true) \
              | python3 scripts/security_gate.py npm "$app"
          done
      - name: Runtime image (Grype; fixable High or Critical fails)
        run: |
          docker build --target runtime -t pipridge-runtime:ci .
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$GRYPE" \
            pipridge-runtime:ci --only-fixed --fail-on high
          test "$(docker run --rm pipridge-runtime:ci id -u)" = 10001
