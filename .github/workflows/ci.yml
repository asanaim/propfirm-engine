name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      valkey:
        image: valkey/valkey:9.1.3-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 2s
          --health-timeout 3s --health-retries 30
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: propfirm
          POSTGRES_PASSWORD: propfirm-ci
          POSTGRES_DB: propfirm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U propfirm -d propfirm" --health-interval 2s
          --health-timeout 3s --health-retries 30
    env:
      VALKEY_URL: redis://localhost:6379/0
      DATABASE_URL: postgresql://propfirm:propfirm-ci@localhost:5432/propfirm
      # CI must run the integration tests, never skip them.
      PROPFIRM_REQUIRE_SERVICES: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
      - run: uv python install 3.14
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy
      - run: uv run --frozen pytest
