# Local development stack. Ports bind to 127.0.0.1 only.
# Run the full test suite:  docker compose run --rm test

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-propfirm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-propfirm-dev}
      POSTGRES_DB: ${POSTGRES_DB:-propfirm}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:9.1.3-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  test:
    profiles: ["test"]  # started by `docker compose run --rm test`, not by `up`
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      VALKEY_URL: redis://valkey:6379/0
      DATABASE_URL: postgresql://${POSTGRES_USER:-propfirm}:${POSTGRES_PASSWORD:-propfirm-dev}@postgres:5432/${POSTGRES_DB:-propfirm}
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./config:/app/config:ro
    command: ["uv", "run", "--frozen", "pytest"]

  # --- the platform (P2): docker compose --profile platform up ---------------
  engine:
    profiles: ["platform"]
    build: .
    depends_on: &services
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment: &platform-env
      VALKEY_URL: redis://valkey:6379/0
      DATABASE_URL: postgresql://${POSTGRES_USER:-propfirm}:${POSTGRES_PASSWORD:-propfirm-dev}@postgres:5432/${POSTGRES_DB:-propfirm}
      PROPFIRM_ANCHOR_PATH: /var/lib/propfirm/anchors.jsonl
    volumes:
      - anchors:/var/lib/propfirm
      - ./config:/app/config:ro  # edit config/policy.toml, then restart the engine
    command: ["/opt/venv/bin/python", "-m", "propfirm.service.engine"]
    stop_grace_period: 15s

  projector:
    profiles: ["platform"]
    build: .
    depends_on: *services
    environment: *platform-env
    command: ["/opt/venv/bin/python", "-m", "propfirm.service.projector"]

  api:
    profiles: ["platform"]
    build: .
    depends_on: *services
    environment: *platform-env
    volumes:
      - ./config:/app/config:ro
    ports:
      - "127.0.0.1:8000:8000"  # localhost only until login exists (P2 step 2)
    command: ["/opt/venv/bin/uvicorn", "propfirm.api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  # Development only: synthetic prices, never real ones (CLAUDE.md).
  feeder:
    profiles: ["platform"]
    build: .
    depends_on: *services
    environment: *platform-env
    command: ["/opt/venv/bin/python", "-m", "propfirm.service.feeder"]

  scheduler:
    profiles: ["platform"]
    build: .
    depends_on: *services
    environment: *platform-env
    command: ["/opt/venv/bin/python", "-m", "propfirm.service.scheduler"]

volumes:
  pgdata:
  anchors:
