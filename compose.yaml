# Local development stack. Ports bind to 127.0.0.1 only.
# Run the full test suite:  docker compose run --rm --build test

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-propfirm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-propfirm-dev}
      POSTGRES_DB: ${POSTGRES_DB:-propfirm}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:9.1.3-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  test:
    profiles: ["test"]  # started by `docker compose run --rm --build test`, not by `up`
    build: {context: ., target: test}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      VALKEY_URL: redis://valkey:6379/0
      DATABASE_URL: postgresql://${POSTGRES_USER:-propfirm}:${POSTGRES_PASSWORD:-propfirm-dev}@postgres:5432/${POSTGRES_DB:-propfirm}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ISSUER: http://localhost:8080/realms/propfirm
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./config:/app/config:ro
    command: ["uv", "run", "--frozen", "pytest"]

  # --- the platform (P2): docker compose --profile platform up ---------------
  engine:
    profiles: ["platform"]
    build: &runtime {context: ., target: runtime}  # non-root, no dev tools
    depends_on: &services
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      anchors-init:
        condition: service_completed_successfully
    environment: &platform-env
      VALKEY_URL: redis://valkey:6379/0
      DATABASE_URL: postgresql://${POSTGRES_USER:-propfirm}:${POSTGRES_PASSWORD:-propfirm-dev}@postgres:5432/${POSTGRES_DB:-propfirm}
      PROPFIRM_ANCHOR_PATH: /var/lib/propfirm/anchors.jsonl
      PROPFIRM_PRICE_SOURCE: synthetic  # compose.live.yaml: twelve_data
    volumes:
      - anchors:/var/lib/propfirm
      - ./config:/app/config:ro  # edit config/policy.toml, then restart the engine
    command: ["/opt/venv/bin/python", "-m", "propfirm.service.engine"]
    stop_grace_period: 15s

  # The services run as uid 10001; a volume made by an earlier, root-run image
  # is handed over once (the only container that runs as root, and exits).
  anchors-init:
    profiles: ["platform"]
    build: *runtime
    user: "0:0"
    volumes:
      - anchors:/var/lib/propfirm
    command: ["chown", "-R", "10001:10001", "/var/lib/propfirm"]

  projector:
    profiles: ["platform"]
    build: *runtime
    depends_on: *services
    environment: *platform-env
    command: ["/opt/venv/bin/python", "-m", "propfirm.service.projector"]

  # Login. Realm (clients, roles, test users): config/keycloak/propfirm-realm.json
  keycloak:
    profiles: ["platform", "test"]
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]  # development mode: its own file database
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-dev}
      KC_HOSTNAME: http://localhost:8080  # the issuer in every token
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"  # the API fetches keys from keycloak:8080
      KC_HEALTH_ENABLED: "true"
    volumes:
      - keycloak:/opt/keycloak/data  # users and sessions survive restarts
      - ./config/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 60

  api:
    profiles: ["platform"]
    build: *runtime
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      <<: *platform-env
      OIDC_ISSUER: http://localhost:8080/realms/propfirm
      OIDC_JWKS_URL: http://keycloak:8080/realms/propfirm/protocol/openid-connect/certs
      PROPFIRM_SANDBOX: "1"  # sandbox payments and screening: development only
      # leavers' logins disabled at Keycloak (development realm's service account)
      STAFF_IDP_URL: http://keycloak:8080
      STAFF_IDP_CLIENT_ID: staff-cutoff
      STAFF_IDP_CLIENT_SECRET: ${STAFF_IDP_CLIENT_SECRET:-dev-staff-cutoff-secret}
      # the client address for the audit trail: the last entry Caddy (web/) adds
      PROPFIRM_CLIENT_IP_HEADER: X-Forwarded-For
    volumes:
      - ./config:/app/config:ro
    ports:
      - "127.0.0.1:8000:8000"
    command: ["/opt/venv/bin/uvicorn", "propfirm.api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  # Development only: synthetic prices, never real ones (CLAUDE.md).
  feeder:
    profiles: ["platform"]
    build: *runtime
    depends_on: *services
    environment: *platform-env
    command: ["/opt/venv/bin/python", "-m", "propfirm.service.feeder"]

  scheduler:
    profiles: ["platform"]
    build: *runtime
    depends_on: *services
    environment: *platform-env
    command: ["/opt/venv/bin/python", "-m", "propfirm.service.scheduler"]

  # The security audit trail (7b): checks the chain, anchors it beside the
  # journal's anchors, ships it to the SIEM sinks (stdout here: `docker
  # compose logs auditor`). Check by hand:
  #   docker compose --profile platform run --rm auditor /opt/venv/bin/python -m propfirm.audit.service --verify
  auditor:
    profiles: ["platform"]
    build: *runtime
    depends_on: *services
    environment:
      <<: *platform-env
      PROPFIRM_AUDIT_ANCHOR_PATH: /var/lib/propfirm/audit-anchors.jsonl
      PROPFIRM_SIEM_SINKS: stdout
    volumes:
      - anchors:/var/lib/propfirm
    command: ["/opt/venv/bin/python", "-m", "propfirm.audit.service"]

  # Demo data (development only): logins with the password 12345, the staff
  # directory, traders with paid evaluation accounts, a case, pending approvals.
  #   docker compose --profile platform run --rm demo-seed
  demo-seed:
    profiles: ["demo"]
    build: *runtime
    depends_on:
      api:
        condition: service_started
      keycloak:
        condition: service_healthy
    environment:
      <<: *platform-env
      PROPFIRM_SANDBOX: "1"
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-dev}
    volumes:
      - ./config:/app/config:ro
    command: ["/opt/venv/bin/python", "-m", "propfirm.demo.seed"]

  # The two web apps, built and served by Caddy (no Node needed to run them).
  # Development with hot reload is still `npm run dev` in each folder (stop
  # these two first: same ports).
  portal:
    profiles: ["platform"]
    build:
      context: ./portal
      dockerfile: ../web/Dockerfile
      additional_contexts:
        web: ./web
    depends_on:
      api:
        condition: service_started
    environment: &web-env
      PORT: "5173"
      API_UPSTREAM: api:8000
      OIDC_ORIGIN: http://localhost:8080
    ports:
      - "127.0.0.1:5173:5173"
    read_only: true
    tmpfs: [/tmp]

  backoffice:
    profiles: ["platform"]
    build:
      context: ./backoffice
      dockerfile: ../web/Dockerfile
      additional_contexts:
        web: ./web
    depends_on:
      api:
        condition: service_started
    environment:
      <<: *web-env
      PORT: "5174"
    ports:
      - "127.0.0.1:5174:5174"
    read_only: true
    tmpfs: [/tmp]

volumes:
  pgdata:
  anchors:
  keycloak:
